[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccvf"
version = "0.1.0"
description = "CCVF/CAVER candidate-conditioned verification benchmark"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "openai>=1.40",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyarrow>=15.0"]

[project.scripts]
ccvf = "ccvf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
