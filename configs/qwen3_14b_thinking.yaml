run:
  run_id: qwen3_14b_thinking
  output_dir: results/runs
  overwrite: false
  resume: true
  seed: 13
dataset:
  path: data/ccvf_data.jsonl
  allow_non_json_lines: false
  limit: null
prompt_dir: prompts
inference:
  temperature: 0.0
  top_p: 1.0
  max_output_tokens: 4096
  preflight_max_output_tokens: 4096
  timeout_seconds: 600
  concurrency: 16
  retries: 2
  retry_backoff_seconds: 2.0
models:
  - id: Qwen3-14B
    provider: local_openai
    model: Models/Qwen3-14B
    base_url: http://127.0.0.1:8001/v1
    api_key_env: LOCAL_OPENAI_API_KEY
    response_format: none
    max_tokens_param: max_tokens
    max_workers: 16
    extra_body:
      chat_template_kwargs:
        enable_thinking: true
serve:
  dtype: half
  gpu_memory_utilization: 0.80
  max_model_len: 8192     
  generation_config: vllm
  max_num_seqs: 16